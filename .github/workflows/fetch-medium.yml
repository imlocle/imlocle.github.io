name: Fetch Medium Posts

on:
    schedule:
        - cron: "0 16 * * 2" # Tuesday 8 AM PST (4 PM UTC)
    workflow_dispatch: # Manual trigger option

jobs:
    fetch:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - run: npm ci
            - run: node scripts/fetchMediumPosts.mjs

            - name: Commit and push changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/medium-posts.json
                  git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update medium posts" && git push)
