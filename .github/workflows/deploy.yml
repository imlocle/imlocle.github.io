name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated to latest version

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Updated to latest version
        with:
          node-version: '22' # Match your local Node.js version
          cache: 'npm'

      - name: Check for API URL
        run: |
          if [ -z "${{ secrets.REACT_APP_API_URL }}" ]; then
            echo "Error: REACT_APP_API_URL is not set in GitHub Secrets"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }} # Added for API key

      - name: Debug Build Output
        run: ls -la dist
        if: failure()

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true